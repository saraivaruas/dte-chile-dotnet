name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test dotnet/DteChile.sln --nologo
  spec-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/gen_spec.py
      - name: La especificación generada debe coincidir con la versionada
        run: git diff --exit-code
